name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  LAKE_ROOT: ${{ github.workspace }}/data
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_cfpb
  SILVER_PATH: ${{ github.workspace }}/data/silver/complaints
  COMPANY_MAP_PATH: ${{ github.workspace }}/data/silver/company_map
  DBT_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/cfpb.duckdb

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check pipeline tests

      - name: Unit + end-to-end Spark tests
        run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build sample lake (synthetic data)
        run: |
          python -m pipeline.generate_sample_data --rows 5000 --out data/raw/sample/initial.csv
          python -m pipeline.run_pipeline --input data/raw/sample/initial.csv --format csv --mode full
          mkdir -p data/warehouse

      # Slim CI: on PRs, compare against the manifest of the last main build and only
      # build what changed (+ downstream). Falls back to a full build if no manifest yet.
      - name: Fetch previous manifest (main)
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name: dbt-manifest
          path: prod-artifacts

      - name: dbt seed
        working-directory: dbt_cfpb
        run: dbt seed

      - name: dbt build (slim on PRs, full otherwise)
        working-directory: dbt_cfpb
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f ../prod-artifacts/manifest.json ]; then
            dbt build --select state:modified+ --defer --state ../prod-artifacts
          else
            dbt build
          fi

      - name: dbt docs
        working-directory: dbt_cfpb
        run: dbt docs generate

      - name: Publish manifest for future slim CI
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt_cfpb/target/manifest.json

      - name: Upload DQ report
        uses: actions/upload-artifact@v4
        with:
          name: dq-report
          path: data/reports/
