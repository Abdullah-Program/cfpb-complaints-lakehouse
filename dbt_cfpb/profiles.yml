cfpb:
  target: dev
  outputs:
    # Local DuckDB target (Free, local execution)
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/warehouse/cfpb.duckdb') }}"
      threads: 4

    # Snowflake Enterprise Cloud target (MFA-enabled via Password + TOTP concatenation)
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      authenticator: snowflake
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CFPB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
      client_session_keep_alive: true
