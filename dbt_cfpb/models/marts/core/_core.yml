version: 2

models:
  - name: dim_date
    description: Calendar dimension (2011-07-01 to 2035-12-31).
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_company
    description: One row per canonical company after entity resolution, plus an Unknown member.
    columns:
      - name: company_sk
        data_tests: [unique, not_null]
      - name: company_name_clean
        data_tests: [not_null]

  - name: dim_product
    description: Canonical product labels with analytical product group.
    columns:
      - name: product_sk
        data_tests: [unique, not_null]

  - name: dim_issue
    description: Distinct issue / sub-issue pairs.
    columns:
      - name: issue_sk
        data_tests: [unique, not_null]

  - name: dim_geography
    description: States, territories and military mail codes with Census region, plus Unknown.
    columns:
      - name: state_code
        data_tests: [unique, not_null]

  - name: fact_complaints
    description: >
      Fact table, one row per complaint. Incremental (delete+insert on complaint_id)
      with a lookback window so late-arriving rows and corrections are applied idempotently.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: date_received
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: company_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_sk
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: issue_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_issue')
                field: issue_sk
      - name: state_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: state_code
