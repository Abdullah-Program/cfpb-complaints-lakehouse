name: cfpb_complaints
version: "1.0.0"
config-version: 2
profile: cfpb

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental fact: re-process rows updated in the last N days of data
  # (CFPB corrections / late-arriving rows).
  lookback_days: 7

# Source locations are read from env vars in models/staging/_sources.yml:
#   SILVER_PATH       (default ../data/silver/complaints)
#   COMPANY_MAP_PATH  (default ../data/silver/company_map)

models:
  cfpb_complaints:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts
      analytics:
        +materialized: table
        +schema: analytics

seeds:
  cfpb_complaints:
    +schema: reference

snapshots:
  cfpb_complaints:
    +target_schema: snapshots
